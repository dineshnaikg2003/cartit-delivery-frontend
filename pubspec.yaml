name: cartit_delivery
description: "CartIT Delivery Partner Application - Zepto inspired UX with order allocation and real-time tracking."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  provider: ^6.1.5
  flutter_secure_storage: ^10.3.1
  intl: ^0.20.2
  geolocator: ^13.0.2
  google_maps_flutter: ^2.10.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

